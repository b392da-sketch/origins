name: gate

# Runs a milestone gate on GitHub's machines, up to three histories per job side by side (gates/plan.py), many jobs at once.
# Start it by pushing a request file to gates/requests/ on the "gate" branch
# (or with "Run workflow" on the Actions page, naming the request file).
# Results and the report are committed to the "gate-results" branch under results/<label>/.
# A history that is not finished after one machine's time limit continues from its checkpoint in a second
# stage and, if needed, a third (about 13 hours in all); a request can also name only some jobs ("jobs": ["4:1", ...]).

on:
  push:
    branches: [gate]
    paths: ["gates/requests/*.json"]
  workflow_dispatch:
    inputs:
      request:
        description: "Request file, e.g. gates/requests/g1.json"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      request: ${{ steps.pick.outputs.request }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            echo "request=${{ github.event.inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            f=$(git diff --name-only HEAD~1 HEAD -- gates/requests/ | head -n 1)
            echo "request=$f" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        run: echo "matrix=$(python3 gates/plan.py '${{ steps.pick.outputs.request }}')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: run
        run: gates/run_job.sh "${{ needs.plan.outputs.request }}" ${{ matrix.kind }} "${{ matrix.jobs }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4            # a history that ran out of time carries on in the next stage
        with:
          name: ckpt-${{ matrix.name }}
          path: /tmp/ckpt/
          if-no-files-found: ignore
          retention-days: 2

  continue:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: more-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        id: ck
        continue-on-error: true
        with:
          name: ckpt-${{ matrix.name }}
          path: /tmp/ckpt
      - name: anything to continue?
        id: need
        run: if [ -n "$(ls -A /tmp/ckpt 2>/dev/null)" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "finished in the first stage"; fi
      - uses: actions/checkout@v4
        if: steps.need.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.need.outputs.go == '1'
        with:
          python-version: "3.13"
      - if: steps.need.outputs.go == '1'
        run: pip install -r requirements.txt
      - name: continue
        if: steps.need.outputs.go == '1'
        run: gates/run_job.sh "${{ needs.plan.outputs.request }}" ${{ matrix.kind }} "${{ matrix.jobs }}"
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: more-${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: ckpt2-${{ matrix.name }}
          path: /tmp/ckpt/
          if-no-files-found: ignore
          retention-days: 2

  continue2:
    needs: [plan, continue]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: last-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        id: ck
        continue-on-error: true
        with:
          name: ckpt2-${{ matrix.name }}
          path: /tmp/ckpt
      - name: anything to continue?
        id: need
        run: if [ -n "$(ls -A /tmp/ckpt 2>/dev/null)" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "finished in the first stage"; fi
      - uses: actions/checkout@v4
        if: steps.need.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.need.outputs.go == '1'
        with:
          python-version: "3.13"
      - if: steps.need.outputs.go == '1'
        run: pip install -r requirements.txt
      - name: continue
        if: steps.need.outputs.go == '1'
        run: gates/run_job.sh "${{ needs.plan.outputs.request }}" ${{ matrix.kind }} "${{ matrix.jobs }}"
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: last-${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: ckpt3-${{ matrix.name }}
          path: /tmp/ckpt/
          if-no-files-found: ignore
          retention-days: 2

  continue3:
    needs: [plan, continue2]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: stage4-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        id: ck
        continue-on-error: true
        with:
          name: ckpt3-${{ matrix.name }}
          path: /tmp/ckpt
      - name: anything to continue?
        id: need
        run: if [ -n "$(ls -A /tmp/ckpt 2>/dev/null)" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "finished in an earlier stage"; fi
      - uses: actions/checkout@v4
        if: steps.need.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.need.outputs.go == '1'
        with:
          python-version: "3.13"
      - if: steps.need.outputs.go == '1'
        run: pip install -r requirements.txt
      - name: continue
        if: steps.need.outputs.go == '1'
        run: gates/run_job.sh "${{ needs.plan.outputs.request }}" ${{ matrix.kind }} "${{ matrix.jobs }}"
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: stage4-${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: ckpt4-${{ matrix.name }}
          path: /tmp/ckpt/
          if-no-files-found: ignore
          retention-days: 2

  continue4:
    needs: [plan, continue3]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: stage5-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        id: ck
        continue-on-error: true
        with:
          name: ckpt4-${{ matrix.name }}
          path: /tmp/ckpt
      - name: anything to continue?
        id: need
        run: if [ -n "$(ls -A /tmp/ckpt 2>/dev/null)" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "finished in an earlier stage"; fi
      - uses: actions/checkout@v4
        if: steps.need.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.need.outputs.go == '1'
        with:
          python-version: "3.13"
      - if: steps.need.outputs.go == '1'
        run: pip install -r requirements.txt
      - name: continue
        if: steps.need.outputs.go == '1'
        run: gates/run_job.sh "${{ needs.plan.outputs.request }}" ${{ matrix.kind }} "${{ matrix.jobs }}"
      - uses: actions/upload-artifact@v4
        if: steps.need.outputs.go == '1'
        with:
          name: stage5-${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: [plan, run, continue, continue2, continue3, continue4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: report and publish
        env:
          REQ: ${{ needs.plan.outputs.request }}
        run: |
          export ORIGINS_PARAMS=$(python3 -c "import json;print(json.dumps(json.load(open('$REQ')).get('params',{})))")
          GATE=$(python3 -c "import json;print(json.load(open('$REQ'))['gate'])")
          LABEL=$(python3 -c "import json;print(json.load(open('$REQ'))['label'])")
          rm -rf gates/results_$GATE && mkdir -p gates/results_$GATE
          find artifacts \( -name 'run_*.json' -o -name 'groups_*.json' \) -not -path '*/ckpt-*' -exec cp {} gates/results_$GATE/ \;
          python -m gates.$GATE report > report.md || echo "report failed" >> report.md
          cp "$REQ" request.json
          # publish from a separate clean clone of the results branch (the main checkout has local changes)
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads "$REPO" gate-results >/dev/null; then
            git clone -q --depth 1 --branch gate-results "$REPO" pub
          else
            mkdir pub && git -C pub init -q && git -C pub checkout -q -b gate-results && git -C pub remote add origin "$REPO"
          fi
          rm -rf pub/results/$LABEL && mkdir -p pub/results/$LABEL
          cp gates/results_$GATE/*.json report.md request.json pub/results/$LABEL/
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > pub/results/$LABEL/RUN.txt
          cd pub
          git config user.name "origins-gate"
          git config user.email "origins-gate@users.noreply.github.com"
          git add -A results/$LABEL
          git commit -qm "Gate results: $LABEL (run ${{ github.run_id }})"
          for i in 1 2 3; do git push -q origin gate-results && break; git pull -q --rebase origin gate-results; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: |
            report.md
            gates/results_*/
          retention-days: 90
